<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/checkout.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <!--
          Step 2: checkout form.
          Every input "name" must match the key the server expects
          (fname, lname, street, city, state, zip, cardNumber, expiration, code).
          "required" keeps the form from submitting until every field is filled out.
        -->
        <form name="checkout" id="checkout-form" class="checkout-form">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              autocomplete="given-name"
              required
            />
            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              autocomplete="family-name"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <label for="street">Street Address</label>
            <input
              type="text"
              id="street"
              name="street"
              autocomplete="street-address"
              required
            />
            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              autocomplete="address-level2"
              required
            />
            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              autocomplete="address-level1"
              required
            />
            <label for="zip">Zip Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              inputmode="numeric"
              pattern="[0-9]{5}"
              title="5 digits"
              autocomplete="postal-code"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              inputmode="numeric"
              pattern="[0-9]{16}"
              title="16 digits, no spaces"
              autocomplete="cc-number"
              required
            />
            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              pattern="(0?[1-9]|1[0-2])/[0-9]{2}"
              title="MM/YY"
              autocomplete="cc-exp"
              required
            />
            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              inputmode="numeric"
              pattern="[0-9]{3,4}"
              title="3 or 4 digits"
              autocomplete="cc-csc"
              required
            />
          </fieldset>

          <!-- Step 3: order summary. These are outputs, not inputs: CheckoutProcess fills in the spans. -->
          <fieldset class="order-summary" id="order-summary">
            <legend>Order Summary</legend>
            <p>
              Item Subtotal (<span id="num-items">0</span>):
              <span id="subtotal">$0.00</span>
            </p>
            <p>Tax: <span id="tax">-</span></p>
            <p>Shipping Estimate: <span id="shipping">-</span></p>
            <p class="order-summary__total">
              Order Total: <span id="orderTotal">-</span>
            </p>
          </fieldset>

          <button type="submit" id="checkoutSubmit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
